# Render Blueprint for the Crewkat standalone web service.
#
# Deploy via: Render dashboard -> New -> Blueprint -> connect the repo
# containing this file. Nothing here is provisioned until Danny approves it
# in the Render dashboard.
#
# Cost (as approved 2026-09-26): Starter web service ~$7/mo + 2 GB
# persistent disk ~$0.50/mo.
#
# IMPORTANT: SQLite requires exactly one running instance. numInstances is
# pinned to 1 below; do not scale this service horizontally.

services:
  - type: web
    name: crewkat
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb # 0.5 CPU / 512 MB (Starter-equivalent); named plans like "starter" are no longer valid
    numInstances: 1
    healthCheckPath: /healthz
    disk:
      name: crewkat-data
      mountPath: /data
      sizeGB: 2
    envVars:
      - key: DATA_DIR
        value: /data
      - key: NODE_ENV
        value: production
      # Secrets: entered by Danny in the Render dashboard (never committed).
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      # Automated backups (in-process scheduler; no extra cost).
      # Daily VACUUM INTO snapshot + Sunday weekly tar.gz (DB + blobs),
      # offsite via Resend email attachments, failure alerts by email.
      - key: BACKUP_ALERT_EMAIL
        sync: false # required: backup reports, failure alerts, offsite copies
      - key: BACKUP_HOUR
        sync: false # optional: UTC hour for the daily run (default 3)
      - key: BACKUP_DISK_CAP_MB
        sync: false # optional: max MB kept in /data/backups (default 1024)
      - key: BACKUP_FULL_SIZE_ALERT_MB
        sync: false # optional: warn when the weekly full exceeds this (default 30)
      # Secure persistent login: salt for hashing client IPs on session rows
      # (theft-detection signal only, never a hard block).
      - key: SESSION_IP_SALT
        sync: false
      - key: STRIPE_PREMIUM_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Set to the public URL once known (temporary *.onrender.com URL first,
      # then https://crewkat.com after the DNS cutover).
      - key: CREWKAT_PUBLIC_URL
        sync: false
