    <!-- Apply the saved appearance before React boots: no theme flash on load,
         and the right theme is set even before the app hydrates. React takes
         over (and may apply the account-synced appearance) afterwards. -->
    <script>
      try {
        var ckTheme = window.localStorage.getItem("crewkat-theme") || window.localStorage.getItem("tradesign-theme");
        // No saved choice: the product default is light (2026-10-14), so the
        // first paint is light instead of following the OS setting. React and
        // the account-synced setting take over from here.
        if (ckTheme !== "light" && ckTheme !== "dark") ckTheme = "light";
        document.documentElement.setAttribute("data-theme", ckTheme);
        var ckAccent = window.localStorage.getItem("crewkat-accent");
        if (ckAccent === "orange" || ckAccent === "blue" || ckAccent === "green" || ckAccent === "purple" || ckAccent === "rose") document.documentElement.setAttribute("data-accent", ckAccent);
        // Keep the color-scheme meta in sync with the saved theme so browsers
        // don't force-darken a light page on load.
        if (ckTheme === "light" || ckTheme === "dark") {
          var ckMeta = document.querySelector('meta[name="color-scheme"]');
          if (ckMeta) ckMeta.setAttribute("content", ckTheme);
        }
      } catch (e) {}
    </script>
